services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-tienda
    restart: always
    ports:
      - '5173:80' # Mapea el puerto 5173 del PC al 80 del contenedor
    extra_hosts:
      - 'host.docker.internal:host-gateway' # CLAVE: Permite conectar con el backend en localhost:8080 desde Linux
