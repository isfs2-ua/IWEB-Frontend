server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Configuración opcional para tu proxy de API
    # En vite.config.ts tienes un proxy a localhost:8080.
    # En producción con Docker, Nginx debe manejar esto:
    location /api {
        proxy_pass http://host.docker.internal:8080; # O la IP de tu backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
